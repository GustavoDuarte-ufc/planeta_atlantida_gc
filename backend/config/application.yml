spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration

portal:
  cors-origins: "http://localhost:8081,http://localhost:5173,http://localhost:3000"
  storage:
    tipo: "mongo"
    mongo-database: "portal_arquivos"
  espelho:
    ativo: true
    mongo-database: "portal_dados"
  instagram:
    mongo-uri: ${DB_MONGODB_URI}
    database: "instagram_analytics"
    colecao-perfis: "historico_perfis"
    colecao-posts: "posts_instagram"
